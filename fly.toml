# Fly.io config for the Caldochi API.
# Lives at the repo root because the Docker build context is the root
# (api/Dockerfile copies the root package-lock.json and workspace manifests).

app = "caldochi-api"          # must be globally unique on Fly; change if taken
primary_region = "yyz"        # Toronto, closest to Supabase ca-central-1 (yul is deprecated)

# Fly sends kill_signal, waits kill_timeout, then SIGKILLs.
# shutdown.ts gives up after 4 s, so the forced exit is ours and gets logged.
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "api/Dockerfile"

# Non-secret env only. DATABASE_URL and SUPABASE_URL are Fly secrets.
# HOST/PORT are already set in the Dockerfile.

[http_service]
  internal_port = 3000        # must match PORT the app listens on
  force_https = true
  auto_stop_machines = "stop" # idle machines stop; first request cold-starts one
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"      # time to boot before failures count

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
