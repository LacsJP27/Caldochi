name: CI

on:
  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: run ci
        run: npm ci

      - name: run typecheck
        run: npm run typecheck

      - name: npm test
        run: npm test
